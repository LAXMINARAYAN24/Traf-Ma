# P2.1 data generation, version 2: more demand levels, more asymmetry patterns, more seeds.
# Used with:  python -m trafma collect --config configs/data_v2.yaml [--resume] [--jobs 2]
# configs/data.yaml (phase2_v1, 24 runs) is kept unchanged as the original small dataset.
#
# Why v2 (see docs/STATUS.md): v1 had only 4 fixed demand levels, one asymmetry pattern, a thin "moderate"
# class and 3/1/2 seeds per scenario. v2 adds two intermediate demand levels, a second asymmetric pattern
# (E/W heavy), a single-heavy-arm case, and the plan's seed counts (10 train / 5 val / 5 test per scenario).
#
# Size (measured per-run on v1: about 9 MB for `free`, 20 MB for `moderate`, 49 MB for `heavy`; average about 27 MB):
# 8 scenarios x 20 seeds = 160 runs of 900 s, so an ESTIMATED 4-5 GB under data/phase2_v2/runs (git-ignored) and
# an estimated 20-40 min (a run simulates in about 5 s; labelling adds more). Use --resume to continue.
# For day-to-day Phase 2 development use configs/data_v2_dev.yaml (48 runs, about 1.3 GB) instead.
# Splits are by WHOLE RUN (disjoint seeds); the seed ranges are the ones suggested in DATA_CONTRACTS.
# Seeds 400-404 are reserved for the Phase 3 trusted-calibration set and are deliberately NOT generated here.
dataset_id: phase2_v2
output_dir: data
jobs: 2
base:
  run: {duration_s: 900}
scenarios:
  # --- balanced demand ladder (N = total vehicles scheduled over the run) ---
  - {name: free,           vehicles: 60,  profile: balanced}
  - {name: light_moderate, vehicles: 120, profile: balanced}
  - {name: moderate,       vehicles: 220, profile: balanced}
  - {name: moderate_heavy, vehicles: 300, profile: balanced}
  - {name: heavy,          vehicles: 380, profile: balanced}      # over-saturated by design
  # --- asymmetric patterns (approach_weights are normalised by the generator) ---
  - {name: asymmetric,     vehicles: 260, profile: asymmetric}    # default weights: N/S heavy, E/W light (same as v1)
  - name: asymmetric_ew                                           # E/W heavy, N/S light
    vehicles: 260
    profile: asymmetric
    approach_weights: {N: 0.1, S: 0.1, E: 0.4, W: 0.4}
  - name: single_arm                                              # north arm carries half of all traffic
    vehicles: 200
    profile: custom
    approach_weights: {N: 3, E: 1, S: 1, W: 1}
splits:
  train: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
  val:   [200, 201, 202, 203, 204]
  test:  [300, 301, 302, 303, 304]
